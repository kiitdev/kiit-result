name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: ktlint
        run: ./gradlew :kiit-result:ktlintCheck

      - name: detekt
        run: ./gradlew :kiit-result:detekt

      - name: JVM tests (commonTest)
        run: ./gradlew :kiit-result:jvmTest

      # JS/TS interop annotations were added (see samples/sample-ts), but JS/TS support is not a
      # priority right now (no compiler-enforced exhaustiveness over Kotlin sealed hierarchies in
      # TS, among other limitations), deliberately not gated in CI for this pass.
      # - name: JS tests (commonTest, Node)
      #   run: ./gradlew :kiit-result:jsNodeTest
